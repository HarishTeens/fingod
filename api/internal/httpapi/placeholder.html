<!doctype html>
<!-- Served whenever no UI has been compiled into the binary. `make build` (and
     the Dockerfile) drop the Vite output into internal/httpapi/webdist/, and
     the SPA handler serves that instead the moment an index.html appears. -->
<html lang="en">
  <head><meta charset="utf-8"><title>fingod</title></head>
  <body style="font:16px system-ui;background:#0d0d0d;color:#c3c2b7;padding:3rem">
    <h1 style="color:#fff">fingod</h1>
    <p>The UI is not built into this binary yet.</p>
    <p>Dev: run <code>make web</code> and open <a style="color:#3987e5" href="http://localhost:5173">localhost:5173</a>.<br>
       Packaged: run <code>make build</code>, which compiles the Vite output into the binary.</p>
    <p>The API is live at <code>/api/v1</code> (bearer token required) and <code>/healthz</code>.</p>
  </body>
</html>
